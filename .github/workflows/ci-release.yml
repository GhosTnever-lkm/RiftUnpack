name: Tests, lint, and v1 release
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev,all-formats]'
      - run: ruff check .
      - run: pytest --cov=riftunpack --cov-report=term-missing
  release:
    if: github.event_name != 'pull_request'
    needs: checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e . pyinstaller
      - run: pyinstaller --noconfirm --clean --onefile --name RiftUnpack --paths src packaging/cli_entry.py
      - run: pyinstaller --noconfirm --clean --onefile --windowed --name RiftUnpack-GUI --paths src packaging/gui_entry.py
      - name: Publish v1.0.0 once
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.0.0 --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create v1.0.0 dist/RiftUnpack.exe dist/RiftUnpack-GUI.exe --repo $env:GITHUB_REPOSITORY --title "RiftUnpack v1.0.0" --notes-file CHANGELOG.md
          } else {
            Write-Host "Release v1.0.0 already exists; keeping it unchanged."
          }
