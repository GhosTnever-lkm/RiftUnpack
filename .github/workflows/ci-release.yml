name: Tests, lint, and release
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Linux test dependencies (7-Zip, libarchive, virtual display for the GUI)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y p7zip-full libarchive-dev xvfb
      - name: Windows 7-Zip for the fallback tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value 'C:\Program Files\7-Zip'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev,all-formats]'
      - run: ruff check .
      - run: mypy
        if: runner.os == 'Linux'
      - name: Tests with coverage (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a pytest --cov=riftunpack --cov-report=term-missing --cov-fail-under=80
      - name: Tests with coverage (Windows)
        if: runner.os == 'Windows'
        run: pytest --cov=riftunpack --cov-report=term-missing --cov-fail-under=80
  executables:
    if: github.event_name != 'pull_request'
    needs: checks
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -e . pyinstaller
      - name: Read version
        id: version
        shell: bash
        run: echo "version=$(python -c 'import riftunpack; print(riftunpack.__version__)')" >> "$GITHUB_OUTPUT"
      - run: pyinstaller --noconfirm --clean --onefile --name RiftUnpack --paths src packaging/cli_entry.py
      - run: pyinstaller --noconfirm --clean --onefile --windowed --name RiftUnpack-GUI --paths src packaging/gui_entry.py
      - name: Smoke-test the executables (no 7-Zip on PATH; ZIP and 7z extraction)
        run: python packaging/smoke_test_exe.py dist/RiftUnpack.exe dist/RiftUnpack-GUI.exe
      - uses: actions/upload-artifact@v7
        with:
          name: windows-executables
          path: |
            dist/RiftUnpack.exe
            dist/RiftUnpack-GUI.exe
  release:
    permissions:
      contents: write
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: executables
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: windows-executables
          path: dist
      - name: Publish release for this version (once per version)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.executables.outputs.version }}
        run: |
          $tag = "v$env:VERSION"
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag dist/RiftUnpack.exe dist/RiftUnpack-GUI.exe --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "RiftUnpack $tag" --notes-file CHANGELOG.md
          } else {
            Write-Host "Release $tag already exists; leaving it unchanged."
          }
