[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "riftunpack"
version = "1.0.0"
description = "Fast, offline-first and safety-focused archive extraction for players and modders"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "ghosTnever"}]
keywords = ["archive", "extractor", "unarchiver", "modding", "7z", "zip", "offline"]
classifiers = ["Programming Language :: Python :: 3", "Programming Language :: Python :: 3 :: Only", "Operating System :: OS Independent", "Topic :: System :: Archiving :: Compression"]
dependencies = ["rich>=13.7", "py7zr>=0.20", "rarfile>=4.1", "tkinterdnd2>=0.4"]

[project.optional-dependencies]
all-formats = ["libarchive-c>=5.1", "zstandard>=0.22"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "pyinstaller>=6.0", "py7zr>=0.20"]

default = []

[project.scripts]
riftunpack = "riftunpack.cli:main"
riftunpack-gui = "riftunpack.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
